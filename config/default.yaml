imu:
  expected_sensors: [L, R, C]
  board: Seeed Studio XIAO nRF52840 Sense
  sensor: LSM6DS3TR-C
  firmware_library: Seeed_Arduino_LSM6DS3
  firmware_read_convention:
    accel_unit: g
    gyro_unit: deg_s
    accel_range_g: 4          # Firmware/receiver defaults and ~8200 raw counts/g support this range.
    gyro_range_dps: 2000
    accel_to_mps2: 9.80665
    gyro_to_rad_s: 0.017453292519943295
  wheel_mounting:
    left_face: outward
    right_face: outward
    mirrored_sides: true
    wheel_axis_selection: train_only_per_side
    forward_rotation_sign: train_only_per_side
  csv_storage:
    format: raw_int16_register_counts
    observed_rest_accel_norm_counts: 8200
    library_float_encoding_verified: false
    raw_encoding_verified: true
  units:
    assumed_profile: firmware_receiver_audited_raw_counts
    verified: false           # Nominal sensitivities established; exact acquisition range readback unavailable.
    accel_sensitivity_g_per_count: 0.000122
    gyro_sensitivity_dps_per_count: 0.070

# Matsunaga Sport Wheelchair "MP-ADJUST" with WheelSense v.1 mounts.
chair:
  R: 0.30                    # Wheel radius [m]
  L_hub: 0.52                # Hub-to-hub wheel distance [m]
  imu_offset_m: 0.04         # IMU to wheel center [m]
  reflector_offset_m: 0.066  # MoCap reflector to wheel center, outboard [m]
  alpha: 0.0                 # Camber disabled
  g: 9.80665                 # Standard gravity [m/s^2]
  model: Matsunaga MP-ADJUST

baseline_recipe:
  gyro_scale: 1.102644416543689
  yaw_scale: 1.0
  chassis_yaw_scale: 1.1711125569290826
  yaw_delay_frames: 27
  yaw_delay_pad: burst
  yaw_source: auto
  speed_mode: legacy
  wheel_radius_m: 0.30
  track_width_m: 0.52

# Nominal/model rates. Raw IMU timing remains derived from device timestamps
# (approximately 102.4 Hz in the current recordings).
sampling:
  imu_hz: 100
  gt_hz: 20
  sync_ratio: 5
  stationary_s: 5.0          # Expected initial stationary period in most trials
  stationary_must_validate: true

# Legacy/experiment synchronization recipe. The production acceptance gate
# remains synchronization.minimum_correlation below.
sync:
  max_lag_s: 5.0
  smooth_win: 11
  min_corr: 0.35
  mocap_overlap_pad_s: 5.0
  idle_path_speed_thr: 0.05
  idle_yaw_rate_thr: 0.15
  idle_pad_s: 1.0
  min_active_s: 1.0
  by_condition:
    10x5up:
      idle_pad_s: 2.0
    slup:
      idle_pad_s: 2.0

mocap:
  required_points: [L_FAL, R_FAL]
  pair_distance_min_tolerance_m: 0.010
  pair_distance_mad_multiplier: 5.0
  axle_tol: 0.08
  max_hub_std: 0.01
  max_hub_bad_frac: 0.001
  min_axle_good_raw: 0.25
  min_sync_corr: 0.50
  max_first_motion_s: 3.0
  min_path_len_m: 1.0
  min_path_by_condition:
    10x5: 40.0
    10x5up: 40.0
    slup: 15.0
  min_abs_yaw_by_condition:
    10x5: 20.0
  axle_crop_pad_s: 0.25

ground_truth:
  derivative_lowpass_hz: 6.0
  derivative_filter_order: 2
  interpolation_max_gap_factor: 1.5

synchronization:
  coarse_search_range_s: 2.0
  refinement_step_s: 0.0001
  minimum_correlation: 0.6
